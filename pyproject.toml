[project]
name = "verity-steelhacks"
version = "0.1.0"
description = "Model-independent Verity assessment and human-review backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "pdfplumber==0.11.10",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
